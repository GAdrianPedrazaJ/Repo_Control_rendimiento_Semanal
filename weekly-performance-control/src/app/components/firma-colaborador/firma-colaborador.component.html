<div class="firma-control">
  <div class="firma-meta">
    <span>{{ nombre }} ({{ idColaborador }})</span>
    <small *ngIf="timestampFirma">Firmado: {{ timestampFirma }}</small>
  </div>

  <button
    type="button"
    [disabled]="yaFirmado || firmo"
    (click)="abrirPanelFirma()"
    [ngClass]="{ firmada: yaFirmado || firmo }"
    class="btn-firmar"
  >
    <app-icon [name]="yaFirmado || firmo ? 'check' : 'pen'" [size]="'sm'"></app-icon>
    {{ yaFirmado || firmo ? 'Firmado' : 'Firmar' }}
  </button>

  <!-- MODAL DE FIRMA -->
  <div *ngIf="mostrarPanelFirma" class="firma-modal-overlay">
    <div class="firma-modal">
      <div class="modal-header">
        <h3>Firma de {{ nombre }}</h3>
        <button type="button" class="btn-close" (click)="cerrarPanelFirma()">
          <app-icon name="close" [size]="'sm'"></app-icon>
        </button>
      </div>

      <div class="modal-body">
        <p class="instruccion">Dibuja tu firma en el área blanca</p>
        <p class="instruccion warning" *ngIf="!hasDrawn">Debes dibujar una firma antes de confirmar.</p>
        <canvas
          #signatureCanvas
          class="signature-canvas"
          width="500"
          height="200"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseUp()"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd()"
        ></canvas>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="limpiarFirma()">
          <app-icon name="refresh" [size]="'sm'"></app-icon>
          Limpiar
        </button>
        <button type="button" class="btn-secondary" (click)="cerrarPanelFirma()">
          <app-icon name="close" [size]="'sm'"></app-icon>
          Cancelar
        </button>
        <button type="button" class="btn-primary" [disabled]="!hasDrawn" (click)="confirmarFirma()">
          <app-icon name="check" [size]="'sm'"></app-icon>
          Confirmar Firma
        </button>
      </div>
    </div>
  </div>
</div>
