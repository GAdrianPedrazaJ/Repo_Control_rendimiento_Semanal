<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">SL</div>
      <h1>Control de Rendimiento Semanal</h1>
      <p class="subtitle">Identificación de usuario</p>
    </div>

    <form (ngSubmit)="onIngresar()" class="login-form">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Tu nombre..."
          (keypress)="onKeyPress($event)"
          [disabled]="cargando"
          class="form-input"
          autocomplete="off" />
      </div>

      <button type="submit" class="btn-ingresar" [disabled]="cargando">
        <span *ngIf="cargando" class="btn-loading">
          <app-icon name="loading" size="18"></app-icon>
          Verificando...
        </span>
        <span *ngIf="!cargando">Ingresar</span>
      </button>
    </form>

    <!-- Demo Users -->
    <div class="demo-section">
      <p class="demo-title">O ingresa como usuario de prueba:</p>
      <div class="demo-buttons">
        <button
          *ngFor="let user of demoUsers"
          type="button"
          class="btn-demo"
          (click)="onDemoLogin(user)"
          [disabled]="cargando"
        >
          <app-icon name="user" [size]="'sm'"></app-icon>
          <span>{{ user.username }}</span>
        </button>
      </div>
    </div>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>
  </div>
</div>
