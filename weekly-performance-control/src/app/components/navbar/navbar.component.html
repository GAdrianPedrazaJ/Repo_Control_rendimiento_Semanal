<nav class="navbar">
  <!-- LEFT SECTION: LOGO + INFO -->
  <div class="navbar-left">
    <div class="logo">
      <app-icon name="dashboard" size="28" customClass="logo-icon"></app-icon>
    </div>
    <div class="nav-info">
      <h3 class="app-title">Control Rendimiento</h3>
      <p class="breadcrumb" *ngIf="area">{{ area }} • Semana {{ semana }} de {{ anio }}</p>
    </div>
  </div>

  <!-- CENTER SECTION: SYNC STATUS -->
  <div class="navbar-center">
    <div class="sync-badge" [ngClass]="'status-' + syncStatus">
      <span class="status-dot"></span>
      <span class="status-text">{{ getStatusLabel() }}</span>
    </div>
  </div>

  <!-- RIGHT SECTION: USER PROFILE -->
  <div class="navbar-right">
    <button class="profile-btn" (click)="toggleDropdown()">
      <span class="avatar">{{ userInitial }}</span>
      <span class="username">{{ username }}</span>
      <app-icon [name]="showDropdown ? 'chevron-up' : 'chevron-down'" [size]="14" customClass="chevron-icon"></app-icon>
    </button>

    <!-- DROPDOWN MENU -->
    <div class="dropdown-menu" *ngIf="showDropdown">
      <div class="dropdown-item user-profile">
        <div class="profile-header">
          <div class="avatar-large">{{ userInitial }}</div>
          <div class="profile-info">
            <p class="profile-name">{{ username }}</p>
            <p class="profile-role">Supervisor</p>
          </div>
        </div>
      </div>

      <div class="dropdown-divider"></div>

      <button class="dropdown-item danger" (click)="onLogout()">
        <app-icon name="logout" [size]="'sm'"></app-icon>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</nav>
